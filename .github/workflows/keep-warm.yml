name: Keep backend warm

# Render's free tier puts a service to sleep after ~15 minutes without traffic,
# and the next request then pays a cold start of roughly a minute. Pinging a
# trivial health endpoint every 10 minutes keeps the instance resident, so the
# dashboard and the contact form answer immediately.
#
# The public portfolio does not depend on this: its content is baked into the
# build and cached in the browser. This is belt and braces for the parts that
# genuinely need a live backend.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.BACKEND_URL || 'https://my-portfolio-backend-awei.onrender.com' }}/api/crm/health/"
          echo "Pinging $URL"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || true)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Health check did not return 200 after 3 attempts."
          exit 1
